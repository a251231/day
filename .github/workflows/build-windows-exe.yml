name: build-windows-exe

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build CLI exe (onefile)
        shell: cmd
        run: |
          pyinstaller --noconfirm --clean --paths . --onefile -n daily_wecom_report packaging/cli_entry.py

      - name: Build UI (onedir)
        shell: cmd
        run: |
          pyinstaller --noconfirm --clean --paths . --onedir -n wecom_report_ui packaging/ui_entry.py ^
            --add-data "wecom_report_ui.py;." ^
            --add-data "UI使用说明.md;." ^
            --add-data "daily_wecom_report.py;."

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            dist/daily_wecom_report.exe
            dist/wecom_report_ui/**
